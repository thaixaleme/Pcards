<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Picards">
<meta name="theme-color" content="#FFD43B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Picards</title>
<style>
/* Màu: thanh tiêu đề vàng, nút chính đỏ cam. --sel: màu thẻ đang chọn (chế độ Select) */
:root{--bg:#fffbea;--card:#fff;--text:#1f1a10;--muted:#7a7160;--line:#efe5c4;--pri:#D9480F;--danger:#dc2626;--hd-bg:#FFD43B;--hd-text:#4a3500;--tile:#f6efd6;--sel:#2563eb;--cols:3;--fit:cover}
@media (prefers-color-scheme:dark){
:root{--bg:#111012;--card:#1c1b1f;--text:#eeeae0;--muted:#a39d8f;--line:#2f2d33;--pri:#FF7A3D;--danger:#f87171;--hd-bg:#3d3000;--hd-text:#FFD43B;--tile:#26252a;--sel:#60a5fa}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:env(safe-area-inset-bottom)}
body.lock{overflow:hidden}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--hd-bg);border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0 4px;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--hd-text)}
header .icon{color:var(--hd-text)}
main{max-width:900px;margin:0 auto;padding:14px 12px 100px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.icon{background:none;border:0;font-size:22px;min-width:40px;height:40px;border-radius:10px;color:var(--pri);padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.icon.text{font-size:17px;font-weight:600}
.icon:disabled{opacity:.4}
#back{font-size:34px;line-height:1;padding-bottom:4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:600}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;margin:10px 0}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
.center{text-align:center}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
input[type=text],select{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);min-width:0}
input[type=text]{display:block;width:100%;margin-top:4px}
label,.label{display:block;margin:10px 0;font-size:14px;color:var(--muted)}
label select{display:block;width:100%;margin-top:4px}

/* Màn hình chính: danh sách album. Ảnh bìa = 3 thẻ đầu tiên xòe ra như cầm bài */
.albums{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:600px){.albums{grid-template-columns:repeat(3,1fr)}}
.alb{position:relative;display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cov{position:relative;aspect-ratio:1/1;background:var(--tile);overflow:hidden}
.cov img{position:absolute;left:50%;top:52%;height:76%;aspect-ratio:63/88;object-fit:cover;border-radius:6px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);transform:translate(-50%,-50%) translateX(var(--dx)) rotate(var(--r))}
.cov .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;opacity:.5}
.alb .cap{padding:8px 10px}
.alb b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alb small{color:var(--muted)}
.alb .mv{position:absolute;top:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:15px}
.alb .mv.l{left:6px}
.alb .mv.r{right:6px}
.newalb{display:block;width:100%;margin-top:14px}

/* Danh sách thẻ trong album (tỉ lệ khung = thẻ bài thật 63 x 88) */
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:8px}
.cd{position:relative;padding:0;border:0;background:var(--tile);border-radius:8px;overflow:hidden;aspect-ratio:63/88;display:block;width:100%}
.cd img{width:100%;height:100%;object-fit:var(--fit);display:block}
.cd .nm{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 4px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .ck{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3);color:#fff;font-size:13px;line-height:20px;text-align:center;font-weight:700}
.cd.sel{outline:3px solid var(--sel);outline-offset:-3px}
.cd.sel .ck{background:var(--sel)}
.cd.sel .ck::after{content:'✓'}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;width:60px;height:60px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ebar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:6px;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.ebar .btn{padding:9px 10px;font-size:14px}

/* Settings */
.sect{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px 10px;margin-bottom:14px}
.sect h3{margin:10px 0 4px;font-size:15px}
.set{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line)}
.set:last-of-type{border-bottom:0}
label.set{margin:0;font-size:16px;color:var(--text)}
.sw{position:relative;flex:none;width:50px;height:30px}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:.2s;pointer-events:none}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+i{background:var(--pri)}
.sw input:checked+i::after{left:23px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 14px;font-size:14px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--pri);color:#fff}

/* Màn hình toàn màn hình (xem thẻ, trình chiếu) */
.ov{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column;touch-action:none;-webkit-user-select:none;user-select:none}
.ov .icon{color:#fff}
.ov .top{display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px}
.ov .cnt{font-size:15px;opacity:.8;padding-left:6px}
.ov .stage{flex:1;position:relative;overflow:hidden}
#vImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center}
.ov .vname{text-align:center;padding:8px 12px calc(14px + env(safe-area-inset-bottom));min-height:46px;font-weight:600}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:34px}
.nav.l{left:8px}
.nav.r{right:8px}
@media (hover:none){.nav{display:none}}
#show{display:block}
#show .sl{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1s}
#show .sl.on{opacity:1}
#show .sl.kb{animation:kb linear forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.shname{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));text-align:center;font-size:18px;font-weight:700;text-shadow:0 1px 4px #000,0 0 12px #000;padding:0 16px;pointer-events:none}
.ctl{position:absolute;inset:0;pointer-events:none;transition:opacity .3s}
.ctl.hide{opacity:0}
.ctl:not(.hide) button{pointer-events:auto}
.ctl .top{position:absolute;left:0;right:0;top:0;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.ctl .bot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:28px;padding:30px 0 calc(70px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6))}
.ctl .bot .icon{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.15);font-size:22px}

dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 6px;font-size:18px}
#dlgBody p{margin:6px 0;white-space:pre-line}
#dlgBtns{justify-content:flex-end;flex-wrap:wrap;margin-bottom:0}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(20,20,20,.9);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <button id="back" class="icon" hidden aria-label="Back">‹</button>
  <h1 id="title">Picards</h1>
  <div id="actions"></div>
</header>
<main id="app"></main>

<!-- Xem thẻ: vuốt trái / phải để chuyển, vuốt xuống để đóng, chụm 2 ngón hoặc chạm 2 lần để phóng to -->
<div id="view" class="ov" hidden>
  <div class="top">
    <button class="icon" id="vClose" aria-label="Close">✕</button>
    <span class="grow cnt" id="vCnt"></span>
    <button class="icon" id="vPlay" aria-label="Slideshow">▶&#xFE0E;</button>
    <button class="icon" id="vName" aria-label="Rename">✎</button>
    <button class="icon" id="vDel" aria-label="Delete">🗑</button>
  </div>
  <div class="stage" id="vStage">
    <img id="vImg" alt="">
    <button class="nav l" id="vPrev" aria-label="Previous">‹</button>
    <button class="nav r" id="vNext" aria-label="Next">›</button>
  </div>
  <div class="vname" id="vCap"></div>
</div>

<!-- Trình chiếu: 2 lớp ảnh chồng nhau để chuyển ảnh mờ dần. Chạm vào màn hình để hiện / ẩn nút -->
<div id="show" class="ov" hidden>
  <img class="sl" alt=""><img class="sl" alt="">
  <div class="shname" id="shName"></div>
  <div class="ctl" id="shCtl">
    <div class="top"><span class="grow cnt" id="shCnt"></span><button class="icon" id="shClose" aria-label="Close">✕</button></div>
    <div class="bot">
      <button class="icon" id="shPrev" aria-label="Previous">◀&#xFE0E;</button>
      <button class="icon" id="shPause" aria-label="Pause"></button>
      <button class="icon" id="shNext" aria-label="Next">▶&#xFE0E;</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <div id="dlgBody"></div>
  <div class="row" id="dlgBtns"></div>
</dialog>
<input type="file" id="addIn" accept="image/*" multiple hidden>
<input type="file" id="fileIn" accept=".zip,application/zip" hidden>
<div id="toast"></div>

<script>
'use strict';
const VERSION = '1.0';
const OPT_KEY = 'picards-opt-v1';
const DB_NAME = 'picards';
const IMG_MAX = 1800;   // cạnh dài tối đa của ảnh thẻ khi lưu (px)
const THUMB_MAX = 480;  // cạnh dài tối đa của ảnh nhỏ dùng trong danh sách (px)
const PLAY = '▶︎', PAUSE = '❚❚';

const $ = s => document.querySelector(s);
const app = $('#app');

// ===== Cài đặt (lưu trong localStorage) =====
const OPT_DEFAULT = { sec: 5, shuffle: false, motion: true, showName: true, cols: 3, fit: 'cover', init: false };
let opt = Object.assign({}, OPT_DEFAULT, load(OPT_KEY));
function load(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}
function saveOpt() {
  try { localStorage.setItem(OPT_KEY, JSON.stringify(opt)); } catch (e) {}
  applyOpt();
}
function applyOpt() {
  document.documentElement.style.setProperty('--cols', opt.cols);
  document.documentElement.style.setProperty('--fit', opt.fit);
}

// ===== Lưu dữ liệu bằng IndexedDB =====
// albums: {id, name, order}
// cards : {id, album, name, order, added, size}   (size: dung lượng ảnh + ảnh nhỏ, byte)
// imgs  : {id, b}  ảnh thẻ (Blob JPEG)      thumbs: {id, b}  ảnh nhỏ (Blob JPEG)
// Thông tin album / thẻ được đọc hết vào bộ nhớ lúc mở app, ảnh thì chỉ đọc khi cần hiện.
let albums = [], cards = [];
let idbp = null;
function idb() {
  if (!idbp) idbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      ['albums', 'cards', 'imgs', 'thumbs'].forEach(n => d.createObjectStore(n, { keyPath: 'id' }));
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return idbp;
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function getAll(store) {
  const d = await idb();
  return reqP(d.transaction(store).objectStore(store).getAll());
}
async function getOne(store, id) {
  const d = await idb();
  return reqP(d.transaction(store).objectStore(store).get(id));
}
// ops: [[tên bảng, 'put' | 'delete' | 'clear', giá trị], ...]  ghi tất cả trong 1 lần (lỗi thì không ghi gì)
async function write(ops) {
  if (!ops.length) return;
  const d = await idb();
  const names = [...new Set(ops.map(o => o[0]))];
  return new Promise((res, rej) => {
    const t = d.transaction(names, 'readwrite');
    ops.forEach(([s, op, v]) => op === 'clear' ? t.objectStore(s).clear() : t.objectStore(s)[op](v));
    t.oncomplete = () => res();
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('Aborted'));
  });
}
const isFull = e => e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''));

// ===== Ảnh =====
const thumbUrls = new Map(); // id thẻ → URL ảnh nhỏ (giữ lại để không phải đọc lại)
async function thumbUrl(id) {
  if (!thumbUrls.has(id)) {
    const r = await getOne('thumbs', id);
    if (!thumbUrls.has(id)) thumbUrls.set(id, r ? URL.createObjectURL(r.b) : '');
  }
  return thumbUrls.get(id);
}
function dropThumb(id) {
  const u = thumbUrls.get(id);
  if (u) URL.revokeObjectURL(u);
  thumbUrls.delete(id);
}
// URL ảnh lớn. Người gọi phải tự URL.revokeObjectURL khi không dùng nữa.
async function imgUrl(id) {
  const r = (await getOne('imgs', id)) || (await getOne('thumbs', id));
  return r ? URL.createObjectURL(r.b) : '';
}
// Chỉ đọc ảnh nhỏ khi ô thẻ sắp hiện trên màn hình (album nhiều thẻ vẫn mở nhanh)
const thumbIO = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  thumbIO.unobserve(e.target);
  setThumb(e.target);
}), { rootMargin: '600px 0px' }) : null;
function setThumb(el) {
  const u = thumbUrls.get(el.dataset.t);
  if (u) el.src = u;
  else thumbUrl(el.dataset.t).then(x => { if (x) el.src = x; });
}
function fillThumbs() {
  app.querySelectorAll('img[data-t]').forEach(el => {
    if (thumbIO && !thumbUrls.has(el.dataset.t)) thumbIO.observe(el); else setThumb(el);
  });
}

function loadImage(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Cannot read image')); };
    im.src = url;
  });
}
// Thu nhỏ ảnh (cạnh dài ≤ max) và chuyển thành JPEG
function toJpeg(im, max, q) {
  const w0 = im.naturalWidth, h0 = im.naturalHeight;
  const s = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w0 * s));
  c.height = Math.max(1, Math.round(h0 * s));
  const g = c.getContext('2d');
  g.fillStyle = '#fff';               // ảnh PNG nền trong suốt → nền trắng
  g.fillRect(0, 0, c.width, c.height);
  g.drawImage(im, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => {
    c.width = c.height = 0;           // giải phóng bộ nhớ (iPhone giới hạn bộ nhớ canvas)
    b ? res(b) : rej(new Error('Cannot convert image'));
  }, 'image/jpeg', q));
}

// ===== Tiện ích =====
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const albumById = id => albums.find(a => a.id === id);
const byOrder = (a, b) => a.order - b.order;
function albumsSorted() { return [...albums].sort(byOrder); }
// Thẻ của 1 album theo thứ tự. 'all': tất cả thẻ, theo thứ tự album rồi thứ tự thẻ
function cardsOf(aid) {
  if (aid === 'all') {
    const ao = new Map(albums.map(a => [a.id, a.order]));
    return [...cards].sort((a, b) => ((ao.get(a.album) || 0) - (ao.get(b.album) || 0)) || a.order - b.order);
  }
  return cards.filter(c => c.album === aid).sort(byOrder);
}
const nextOrder = list => list.reduce((m, x) => Math.max(m, x.order), -1) + 1;

let toastTimer;
function toast(msg, stay) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  if (!stay) toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// actions: [[nội dung nút, nhãn, hàm, class thêm], ...]
function setBar(title, backHash, actions) {
  $('#title').textContent = title;
  const b = $('#back');
  b.hidden = backHash == null;
  b.onclick = () => { location.hash = backHash; };
  const box = $('#actions');
  box.innerHTML = '';
  (actions || []).forEach(([text, label, fn, cls]) => {
    const btn = document.createElement('button');
    btn.className = 'icon ' + (cls || '');
    btn.textContent = text;
    btn.setAttribute('aria-label', label);
    btn.onclick = fn;
    box.appendChild(btn);
  });
}

// Hộp thoại chung: trả về Promise {btn, v}
// fields: [{name, label, value, ph, max, select: [[giá trị, nhãn], ...]}]
// buttons: [{label, value, cls}]  (nút có cls 'primary' được chọn khi bấm Enter)
function ask({ title, msg, fields = [], buttons }) {
  return new Promise(resolve => {
    const d = $('#dlg');
    const finish = btn => {
      const v = {};
      d.querySelectorAll('[name]').forEach(el => { v[el.name] = el.value.trim(); });
      d.oncancel = null;
      d.close();
      resolve({ btn, v });
    };
    d.oncancel = e => { e.preventDefault(); finish(null); };
    $('#dlgTitle').textContent = title;
    $('#dlgBody').innerHTML = (msg ? `<p>${esc(msg)}</p>` : '') + fields.map(f => f.select
      ? `<label>${esc(f.label)}<select name="${f.name}">${f.select.map(([v, l]) =>
          `<option value="${esc(v)}" ${v === f.value ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`
      : `<label>${esc(f.label)}<input type="text" name="${f.name}" value="${esc(f.value || '')}" placeholder="${esc(f.ph || '')}"
          maxlength="${f.max || 40}" autocomplete="off"></label>`).join('');
    const box = $('#dlgBtns');
    box.innerHTML = '';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (b.cls || '');
      btn.textContent = b.label;
      btn.onclick = () => finish(b.value);
      box.appendChild(btn);
    });
    const pri = buttons.find(b => (b.cls || '').includes('primary'));
    d.querySelectorAll('input').forEach(el => el.onkeydown = e => {
      if (e.key === 'Enter' && pri) { e.preventDefault(); finish(pri.value); }
    });
    d.showModal();
    const first = d.querySelector('input');
    if (first) { first.focus(); first.select(); }
  });
}
async function confirmDlg(title, msg, okLabel) {
  const r = await ask({ title, msg, buttons: [{ label: 'Cancel', value: null }, { label: okLabel, value: 'ok', cls: 'primary' }] });
  return r.btn === 'ok';
}

// ===== Điều hướng (theo #hash): '' màn hình chính, 'a/<id>' album ('a/all' tất cả thẻ), 'set' Settings =====
let homeEdit = false;    // màn hình chính: chế độ đổi thứ tự album
let sel = null;          // album: Set id thẻ đang chọn (null = không ở chế độ Select)
window.addEventListener('hashchange', () => { homeEdit = false; sel = null; render(); window.scrollTo(0, 0); });
function render() {
  const [page, id] = location.hash.slice(1).split('/');
  if (page === 'a' && (id === 'all' || albumById(id))) renderAlbum(id);
  else if (page === 'set') renderSettings();
  else renderHome();
}

// ===== Màn hình chính: danh sách album =====
function coverHtml(list) {
  const top = list.slice(0, 3);
  const pos = { 1: [[0, 0]], 2: [[-14, -7], [14, 7]], 3: [[-22, -12], [0, 0], [22, 12]] }[top.length]; // [lệch ngang %, góc xoay]
  return `<div class="cov">${top.length ? top.map((c, i) =>
    `<img data-t="${c.id}" alt="" style="--dx:${pos[i][0]}%;--r:${pos[i][1]}deg">`).join('') : '<span class="ph">🃏</span>'}</div>`;
}
function renderHome() {
  const list = albumsSorted();
  setBar('Picards', null, [
    ...(cards.length ? [[PLAY, 'Slideshow all', () => startShow(cardsOf('all'), 0)]] : []),
    ...(list.length > 1 ? [[homeEdit ? 'Done' : '⇄', homeEdit ? 'Done' : 'Change order', () => { homeEdit = !homeEdit; renderHome(); }, homeEdit ? 'text' : '']] : []),
    ['⚙', 'Settings', () => { location.hash = 'set'; }]
  ]);
  const tile = (a, i) => {
    const cs = cardsOf(a.id);
    const inner = `${coverHtml(cs)}<div class="cap"><b>${esc(a.name)}</b><small>${cs.length} cards</small></div>`;
    if (!homeEdit) return `<a class="alb" href="#a/${a.id}">${inner}</a>`;
    return `<div class="alb" data-a="${a.id}">${inner}
      ${i ? '<button class="mv l" data-mv="-1" aria-label="Move earlier">◀&#xFE0E;</button>' : ''}
      ${i < list.length - 1 ? '<button class="mv r" data-mv="1" aria-label="Move later">▶&#xFE0E;</button>' : ''}</div>`;
  };
  app.innerHTML = `
    ${homeEdit ? '<p class="muted">◀ ▶ change the order of albums.</p>' : ''}
    <div class="albums">
      ${list.length > 1 && !homeEdit ? `<a class="alb" href="#a/all">${coverHtml(cardsOf('all'))}
        <div class="cap"><b>All cards</b><small>${cards.length} cards</small></div></a>` : ''}
      ${list.map(tile).join('')}
    </div>
    ${list.length ? '' : '<p class="empty">No albums yet.</p>'}
    ${homeEdit ? '' : '<button class="btn newalb" id="newAlb">＋ New album</button>'}`;
  fillThumbs();
  const nb = $('#newAlb');
  if (nb) nb.onclick = newAlbum;
  app.querySelectorAll('[data-mv]').forEach(b => b.onclick = async () => {
    const i = list.findIndex(a => a.id === b.closest('[data-a]').dataset.a);
    const j = i + Number(b.dataset.mv);
    const o = list[i].order;
    list[i].order = list[j].order;
    list[j].order = o;
    await write([['albums', 'put', list[i]], ['albums', 'put', list[j]]]);
    renderHome();
  });
}

async function newAlbum() {
  const r = await ask({ title: 'New album', fields: [{ name: 'name', label: 'Album name', ph: 'Pikachu' }],
    buttons: [{ label: 'Cancel', value: null }, { label: 'Create', value: 'ok', cls: 'primary' }] });
  if (r.btn !== 'ok' || !r.v.name) return;
  const a = { id: uid(), name: r.v.name, order: nextOrder(albums) };
  await write([['albums', 'put', a]]);
  albums.push(a);
  location.hash = 'a/' + a.id;

// ===== Album: danh sách thẻ =====
function renderAlbum(aid) {
  const a = albumById(aid);
  const list = cardsOf(aid);
  if (sel) {
    setBar(`${sel.size} selected`, '', [
      ['All', 'Select all', () => { sel = sel.size === list.length ? new Set() : new Set(list.map(c => c.id)); renderAlbum(aid); }, 'text'],
      ['Done', 'Done', () => { sel = null; renderAlbum(aid); }, 'text']]);
  } else {
    setBar(a ? a.name : 'All cards', '', [
      ...(list.length ? [[PLAY, 'Slideshow', () => startShow(list, 0)], ['Select', 'Select cards', () => { sel = new Set(); renderAlbum(aid); }, 'text']] : []),
      ...(a ? [['⋯', 'Album menu', () => albumMenu(a)]] : [])]);
  }
  app.innerHTML = list.length ? `<div class="grid">${list.map(c => `
      <button class="cd ${sel && sel.has(c.id) ? 'sel' : ''}" data-c="${c.id}">
        <img data-t="${c.id}" alt="">${c.name ? `<span class="nm">${esc(c.name)}</span>` : ''}${sel ? '<span class="ck"></span>' : ''}
      </button>`).join('')}</div>`
    : `<p class="empty">${a ? 'No cards yet.<br>Tap ＋ to add photos of your cards.' : 'No cards yet.'}</p>`;
  if (sel) {
    const one = sel.size === 1;
    const i = one ? list.findIndex(c => sel.has(c.id)) : -1;
    app.insertAdjacentHTML('beforeend', `<div class="ebar">
      ${a ? `<button class="btn" data-e="-1" ${one && i > 0 ? '' : 'disabled'} aria-label="Move earlier">◀&#xFE0E;</button>
      <button class="btn" data-e="1" ${one && i < list.length - 1 ? '' : 'disabled'} aria-label="Move later">▶&#xFE0E;</button>` : ''}
      <button class="btn" data-e="name" ${one ? '' : 'disabled'}>Name</button>
      <button class="btn" data-e="move" ${sel.size && albums.length > 1 ? '' : 'disabled'}>Move</button>
      <button class="btn danger" data-e="del" ${sel.size ? '' : 'disabled'}>Delete</button></div>`);
  } else if (a) {
    app.insertAdjacentHTML('beforeend', '<button class="fab" id="add" aria-label="Add cards">＋</button>');
    $('#add').onclick = () => { $('#addIn').dataset.album = aid; $('#addIn').click(); };
  }
  fillThumbs();
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    const id = b.dataset.c;
    if (!sel) { openViewer(list, list.findIndex(c => c.id === id)); return; }
    if (sel.has(id)) sel.delete(id); else sel.add(id);
    renderAlbum(aid);
  });
  app.querySelectorAll('[data-e]').forEach(b => b.onclick = () => editAction(b.dataset.e, aid, list));
}

async function editAction(act, aid, list) {
  const chosen = list.filter(c => sel.has(c.id));
  if (act === '-1' || act === '1') {           // đổi thứ tự: đổi chỗ với thẻ bên cạnh
    const i = list.indexOf(chosen[0]);
    const j = i + Number(act);
    const o = list[i].order;
    list[i].order = list[j].order;
    list[j].order = o;
    await write([['cards', 'put', list[i]], ['cards', 'put', list[j]]]);
  } else if (act === 'name') {
    if (!(await renameCard(chosen[0]))) return;
  } else if (act === 'move') {
    const others = albumsSorted().filter(a => a.id !== aid);
    const r = await ask({ title: `Move ${chosen.length} cards`,
      fields: [{ name: 'to', label: 'To album', select: others.map(a => [a.id, a.name]), value: others[0].id }],
      buttons: [{ label: 'Cancel', value: null }, { label: 'Move', value: 'ok', cls: 'primary' }] });
    if (r.btn !== 'ok' || !albumById(r.v.to)) return;
    let o = nextOrder(cardsOf(r.v.to));
    chosen.forEach(c => { c.album = r.v.to; c.order = o++; });
    await write(chosen.map(c => ['cards', 'put', c]));
    sel = new Set();
    toast(`Moved to ${albumById(r.v.to).name}`);
  } else if (act === 'del') {
    if (!(await confirmDlg('Delete cards', `Delete ${chosen.length} selected cards? This cannot be undone.`, 'Delete'))) return;
    await deleteCards(chosen.map(c => c.id));
    sel = new Set();
  }
  renderAlbum(aid);
}

async function renameCard(c) {
  const r = await ask({ title: 'Card name', fields: [{ name: 'name', label: 'Name', value: c.name, ph: 'Pikachu V' }],
    buttons: [{ label: 'Cancel', value: null }, { label: 'Save', value: 'ok', cls: 'primary' }] });
  if (r.btn !== 'ok') return false;
  c.name = r.v.name;
  await write([['cards', 'put', c]]);
  return true;
}

async function deleteCards(ids) {
  const set = new Set(ids);
  await write(ids.flatMap(id => [['cards', 'delete', id], ['imgs', 'delete', id], ['thumbs', 'delete', id]]));
  ids.forEach(dropThumb);
  cards = cards.filter(c => !set.has(c.id));
}

async function albumMenu(a) {
  const n = cardsOf(a.id).length;
  const r = await ask({ title: a.name, msg: `${n} cards`,
    buttons: [{ label: 'Cancel', value: null }, { label: 'Delete album', value: 'del', cls: 'danger' }, { label: 'Rename', value: 'ren', cls: 'primary' }] });
  if (r.btn === 'ren') {
    const r2 = await ask({ title: 'Rename album', fields: [{ name: 'name', label: 'Album name', value: a.name }],
      buttons: [{ label: 'Cancel', value: null }, { label: 'Save', value: 'ok', cls: 'primary' }] });
    if (r2.btn !== 'ok' || !r2.v.name) return;
    a.name = r2.v.name;
    await write([['albums', 'put', a]]);
    render();
  } else if (r.btn === 'del') {
    if (!(await confirmDlg('Delete album', `Delete album "${a.name}"${n ? ` and its ${n} cards` : ''}? This cannot be undone.`, 'Delete'))) return;
    await deleteCards(cardsOf(a.id).map(c => c.id));
    await write([['albums', 'delete', a.id]]);
    albums = albums.filter(x => x.id !== a.id);
    location.hash = '';
  }
}

// ===== Thêm thẻ (chọn nhiều ảnh cùng lúc từ Photos / camera) =====
$('#addIn').onchange = async e => {
  const files = [...e.target.files];
  const aid = e.target.dataset.album;
  e.target.value = '';
  if (!files.length || !albumById(aid)) return;
  let order = nextOrder(cardsOf(aid));
  let ok = 0, bad = 0;
  for (let i = 0; i < files.length; i++) {
    toast(`Adding ${i + 1} / ${files.length}…`, true);
    try {
      const im = await loadImage(files[i]);
      const b = await toJpeg(im, IMG_MAX, 0.88);
      const t = await toJpeg(im, THUMB_MAX, 0.8);
      const c = { id: uid(), album: aid, name: '', order: order++, added: Date.now(), size: b.size + t.size };
      await write([['imgs', 'put', { id: c.id, b }], ['thumbs', 'put', { id: c.id, b: t }], ['cards', 'put', c]]);
      cards.push(c);
      ok++;
    } catch (err) {
      if (isFull(err)) { toast('Storage is full'); break; }
      bad++;
    }
  }
  toast(`Added ${ok} cards` + (bad ? ` (${bad} could not be read)` : ''));
  if (location.hash === '#a/' + aid) { renderAlbum(aid); window.scrollTo(0, document.body.scrollHeight); }
};

// ===== Xem thẻ =====
let vw = null; // {list, i, url}
let resetZoom = () => {};
function openViewer(list, i) {
  vw = { list: [...list], i, url: '' };
  $('#view').hidden = false;
  document.body.classList.add('lock');
  showCard();
}
async function showCard() {
  const v = vw, c = v.list[v.i];
  $('#vCnt').textContent = `${v.i + 1} / ${v.list.length}`;
  $('#vCap').textContent = c.name;
  $('#vPrev').disabled = v.i === 0;
  $('#vNext').disabled = v.i === v.list.length - 1;
  resetZoom();
  const img = $('#vImg');
  const t = thumbUrls.get(c.id);
  if (t) img.src = t;                       // hiện ảnh nhỏ trước, ảnh lớn đọc xong thì thay
  const u = await imgUrl(c.id);
  if (vw !== v || v.list[v.i] !== c) { URL.revokeObjectURL(u); return; }
  if (v.url) URL.revokeObjectURL(v.url);
  v.url = u;
  img.src = u;
}
function viewGo(d) {
  const j = vw.i + d;
  if (j < 0 || j >= vw.list.length) { resetZoom(true); return; }
  vw.i = j;
  showCard();
}
function closeViewer() {
  if (!vw) return;
  if (vw.url) URL.revokeObjectURL(vw.url);
  vw = null;
  $('#vImg').removeAttribute('src');
  $('#view').hidden = true;
  document.body.classList.remove('lock');
  render();
}
$('#vClose').onclick = closeViewer;
$('#vPrev').onclick = () => viewGo(-1);
$('#vNext').onclick = () => viewGo(1);
$('#vPlay').onclick = () => { const { list, i } = vw; closeViewer(); startShow(list, i); };
$('#vName').onclick = async () => {
  const c = vw.list[vw.i];
  if (await renameCard(c)) $('#vCap').textContent = c.name;
};
$('#vDel').onclick = async () => {
  const c = vw.list[vw.i];
  if (!(await confirmDlg('Delete card', 'Delete this card? This cannot be undone.', 'Delete'))) return;
  await deleteCards([c.id]);
  vw.list.splice(vw.i, 1);
  if (!vw.list.length) { closeViewer(); return; }
  vw.i = Math.min(vw.i, vw.list.length - 1);
  showCard();
};

// Thao tác chạm khi xem thẻ
(() => {
  const st = $('#vStage'), img = $('#vImg');
  let z = { s: 1, x: 0, y: 0 }, t0 = null, pinch = null, lastTap = 0;
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const apply = anim => {
    img.style.transition = anim ? 'transform .25s' : 'none';
    img.style.transform = `translate(${z.x}px,${z.y}px) scale(${z.s})`;
  };
  resetZoom = anim => { z = { s: 1, x: 0, y: 0 }; apply(anim); };
  st.addEventListener('touchstart', e => {
    if (e.touches.length === 2) { pinch = { d: dist(e.touches[0], e.touches[1]), s: z.s }; t0 = null; return; }
    if (e.touches.length > 2 || pinch) return;
    const p = e.touches[0];
    t0 = { x: p.clientX, y: p.clientY, zx: z.x, zy: z.y, t: Date.now(), dx: 0, dy: 0 };
  }, { passive: true });
  st.addEventListener('touchmove', e => {
    e.preventDefault();
    if (pinch && e.touches.length === 2) {
      z.s = Math.min(5, Math.max(1, pinch.s * dist(e.touches[0], e.touches[1]) / pinch.d));
      apply(false);
      return;
    }
    if (!t0) return;
    const p = e.touches[0];
    t0.dx = p.clientX - t0.x;
    t0.dy = p.clientY - t0.y;
    if (z.s > 1) { z.x = t0.zx + t0.dx; z.y = t0.zy + t0.dy; apply(false); return; }
    img.style.transition = 'none';
    img.style.transform = `translate(${t0.dx}px,${Math.max(0, t0.dy)}px)`;   // kéo ảnh theo ngón tay
  }, { passive: false });
  st.addEventListener('touchend', e => {
    if (pinch) {
      if (!e.touches.length) { pinch = null; if (z.s < 1.05) resetZoom(true); }
      return;
    }
    if (!t0) return;
    const { dx, dy } = t0;
    const quick = Date.now() - t0.t < 300;
    t0 = null;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && quick) {     // chạm 2 lần: phóng to / thu nhỏ tại chỗ chạm
      const now = Date.now();
      if (now - lastTap > 300) { lastTap = now; if (z.s === 1) apply(true); return; }
      lastTap = 0;
      if (z.s > 1) { resetZoom(true); return; }
      const r = st.getBoundingClientRect(), p = e.changedTouches[0];
      z.s = 2.5;
      z.x = (p.clientX - r.left - r.width / 2) * (1 - z.s);
      z.y = (p.clientY - r.top - r.height / 2) * (1 - z.s);
      apply(true);
      return;
    }
    if (z.s > 1) return;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) viewGo(dx < 0 ? 1 : -1);
    else if (dy > 120 && dy > Math.abs(dx)) closeViewer();
    else resetZoom(true);
  });
})();

// ===== Trình chiếu =====
let sh = null; // {list, i, cur (lớp ảnh đang hiện 0/1), urls, timer, paused, lock, hideT}
function startShow(list, i) {
  if (!list.length) return;
  list = [...list];
  if (opt.shuffle) {
    const first = list.splice(i, 1)[0];        // thẻ được chọn hiện đầu tiên, các thẻ còn lại trộn ngẫu nhiên
    for (let k = list.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [list[k], list[j]] = [list[j], list[k]]; }
    list.unshift(first);
    i = 0;
  }
  sh = { list, i, cur: 0, urls: ['', ''], timer: null, paused: false, lock: null, hideT: null };
  $('#show').hidden = false;
  document.body.classList.add('lock');
  $('#shPause').textContent = PAUSE;
  keepAwake();
  showCtl();
  showSlide();
}
async function showSlide() {
  const s = sh, c = s.list[s.i];
  clearTimeout(s.timer);
  $('#shCnt').textContent = `${s.i + 1} / ${s.list.length}`;
  const u = await imgUrl(c.id);
  const layers = document.querySelectorAll('#show .sl');
  const nx = 1 - s.cur, el = layers[nx];
  el.src = u;
  try { await el.decode(); } catch (e) {}
  if (sh !== s || s.list[s.i] !== c) { if (s.urls[nx] !== u) URL.revokeObjectURL(u); return; }
  el.classList.remove('kb');
  void el.offsetWidth;                         // chạy lại hiệu ứng phóng to chậm từ đầu
  el.style.animationDuration = (opt.sec + 1.5) + 's';
  if (opt.motion) el.classList.add('kb');
  el.classList.add('on');
  layers[s.cur].classList.remove('on');
  const old = s.urls[nx];
  s.urls[nx] = u;
  s.cur = nx;
  if (old && old !== u) URL.revokeObjectURL(old);
  $('#shName').textContent = opt.showName ? c.name : '';
  schedule();
}
function schedule() {
  clearTimeout(sh.timer);
  if (!sh.paused && sh.list.length > 1) sh.timer = setTimeout(() => showGo(1), opt.sec * 1000);
}
function showGo(d) {
  if (sh.list.length < 2) return;
  sh.i = (sh.i + d + sh.list.length) % sh.list.length;
  showSlide();
}
function stopShow() {
  if (!sh) return;
  clearTimeout(sh.timer);
  clearTimeout(sh.hideT);
  if (sh.lock) sh.lock.release().catch(() => {});
  sh.urls.forEach(u => u && URL.revokeObjectURL(u));
  sh = null;
  document.querySelectorAll('#show .sl').forEach(el => { el.classList.remove('on', 'kb'); el.removeAttribute('src'); });
  $('#show').hidden = true;
  document.body.classList.remove('lock');
}
// Hiện các nút 3 giây rồi tự ẩn
function showCtl() {
  $('#shCtl').classList.remove('hide');
  clearTimeout(sh.hideT);
  sh.hideT = setTimeout(() => { if (sh) $('#shCtl').classList.add('hide'); }, 3000);
}
// Giữ màn hình không tự tắt trong lúc trình chiếu (iPhone: iOS 16.4 trở lên)
async function keepAwake() {
  try { if (sh && navigator.wakeLock) sh.lock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (sh && document.visibilityState === 'visible') keepAwake(); });
$('#shClose').onclick = stopShow;
$('#shPrev').onclick = () => { showGo(-1); showCtl(); };
$('#shNext').onclick = () => { showGo(1); showCtl(); };
$('#shPause').onclick = () => {
  sh.paused = !sh.paused;
  $('#shPause').textContent = sh.paused ? PLAY : PAUSE;
  schedule();
  showCtl();
};
// Vuốt trái / phải: chuyển ảnh. Chạm: hiện / ẩn nút
(() => {
  const box = $('#show');
  let p0 = null;
  box.addEventListener('pointerdown', e => { if (!e.target.closest('button')) p0 = { x: e.clientX, y: e.clientY }; });
  box.addEventListener('pointerup', e => {
    if (!p0 || !sh) return;
    const dx = e.clientX - p0.x, dy = e.clientY - p0.y;
    p0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { showGo(dx < 0 ? 1 : -1); return; }
    if (dy > 120) { stopShow(); return; }
    if ($('#shCtl').classList.contains('hide')) showCtl(); else $('#shCtl').classList.add('hide');
  });
})();

document.addEventListener('keydown', e => {
  if ($('#dlg').open) return;
  if (sh) {
    if (e.key === 'Escape') stopShow();
    else if (e.key === 'ArrowRight') showGo(1);
    else if (e.key === 'ArrowLeft') showGo(-1);
    else if (e.key === ' ') { e.preventDefault(); $('#shPause').click(); }
  } else if (vw) {
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowRight') viewGo(1);
    else if (e.key === 'ArrowLeft') viewGo(-1);
  }
});

// ===== Settings =====
function renderSettings() {
  setBar('Settings', '', []);
  const mb = cards.reduce((s, c) => s + (c.size || 0), 0) / 1048576;
  const sw = (key, label) => `<label class="set"><span class="grow">${label}</span>
    <span class="sw"><input type="checkbox" data-opt="${key}" ${opt[key] ? 'checked' : ''}><i></i></span></label>`;
  const seg = (key, items) => `<div class="seg">${items.map(([v, l]) =>
    `<button data-seg="${key}" data-v="${v}" class="${String(opt[key]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  app.innerHTML = `
    <section class="sect"><h3>Slideshow</h3>
      <div class="set"><span class="grow">Time per card</span>
        <select id="oSec" aria-label="Time per card">${[3, 5, 8, 10, 15, 30].map(v =>
          `<option value="${v}" ${v === opt.sec ? 'selected' : ''}>${v} seconds</option>`).join('')}</select></div>
      ${sw('shuffle', 'Shuffle (random order)')}
      ${sw('motion', 'Slow zoom effect')}
      ${sw('showName', 'Show card name')}
    </section>
    <section class="sect"><h3>Card list</h3>
      <div class="set"><span class="grow">Columns</span>${seg('cols', [[2, '2'], [3, '3'], [4, '4']])}</div>
      <div class="set"><span class="grow">Image</span>${seg('fit', [['cover', 'Fill'], ['contain', 'Whole']])}</div>
    </section>
    <section class="sect"><h3>Storage &amp; backup</h3>
      <p class="muted">${albums.length} albums · ${cards.length} cards · about ${mb.toFixed(1)} MB</p>
      <p class="muted">Images are stored only on this device (they are not uploaded to GitHub).
        Export a backup file regularly (save it to Files / iCloud Drive).</p>
      <div class="row"><button class="btn grow" id="exp">Export</button><button class="btn grow" id="imp">Import</button></div>
    </section>
    <p class="muted center">Picards ${VERSION}</p>`;
  $('#oSec').onchange = e => { opt.sec = Number(e.target.value); saveOpt(); };
  app.querySelectorAll('[data-opt]').forEach(el => el.onchange = () => { opt[el.dataset.opt] = el.checked; saveOpt(); });
  app.querySelectorAll('[data-seg]').forEach(b => b.onclick = () => {
    const k = b.dataset.seg;
    opt[k] = k === 'cols' ? Number(b.dataset.v) : b.dataset.v;
    saveOpt();
    renderSettings();
  });
  $('#exp').onclick = exportData;
  $('#imp').onclick = () => $('#fileIn').click();
}

// ===== Sao lưu / khôi phục (file .zip: data.json + ảnh JPEG, mở được trên máy tính) =====
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// Tạo file zip không nén (ảnh JPEG đã được nén sẵn). data: Uint8Array hoặc Blob
function zipWriter() {
  const parts = [], dir = [];
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let off = 0;
  return {
    async add(name, data) {
      const nm = new TextEncoder().encode(name);
      const u8 = data instanceof Blob ? new Uint8Array(await data.arrayBuffer()) : data;
      const crc = crc32(u8), size = u8.length;
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true);
      h.setUint32(18, size, true); h.setUint32(22, size, true); h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
      parts.push(h, nm, data);                   // Blob: giữ nguyên Blob (không giữ bản sao trong bộ nhớ)
      dir.push({ nm, crc, size, off });
      off += 30 + nm.length + size;
    },
    finish() {
      let len = 0;
      dir.forEach(e => {
        const c = new DataView(new ArrayBuffer(46));
        c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
        c.setUint16(10, 0, true); c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, e.crc, true);
        c.setUint32(20, e.size, true); c.setUint32(24, e.size, true); c.setUint16(28, e.nm.length, true);
        c.setUint32(42, e.off, true);
        parts.push(c, e.nm);
        len += 46 + e.nm.length;
      });
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true); end.setUint16(8, dir.length, true); end.setUint16(10, dir.length, true);
      end.setUint32(12, len, true); end.setUint32(16, off, true);
      parts.push(end);
      return new Blob(parts, { type: 'application/zip' });
    }
  };
}
// Đọc file zip. Trả về {names, get(tên, kiểu) → Blob}. Đọc được cả zip nén lại trên máy tính (nếu trình duyệt hỗ trợ)
async function zipRead(file) {
  const tailLen = Math.min(file.size, 65557);
  const tail = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
  let p = -1;
  for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { p = i; break; }
  if (p < 0) throw new Error('Not a zip file');
  const n = tail.getUint16(p + 10, true), len = tail.getUint32(p + 12, true), start = tail.getUint32(p + 16, true);
  const cd = new DataView(await file.slice(start, start + len).arrayBuffer());
  const dec = new TextDecoder();
  const entries = new Map();
  let q = 0;
  for (let i = 0; i < n; i++) {
    if (cd.getUint32(q, true) !== 0x02014b50) throw new Error('Broken zip file');
    const nl = cd.getUint16(q + 28, true), xl = cd.getUint16(q + 30, true), cl = cd.getUint16(q + 32, true);
    entries.set(dec.decode(new Uint8Array(cd.buffer, q + 46, nl)),
      { method: cd.getUint16(q + 10, true), csize: cd.getUint32(q + 20, true), off: cd.getUint32(q + 42, true) });
    q += 46 + nl + xl + cl;
  }
  return {
    names: [...entries.keys()],
    async get(name, type) {
      const e = entries.get(name);
      if (!e) return null;
      const h = new DataView(await file.slice(e.off, e.off + 30).arrayBuffer());
      const s = e.off + 30 + h.getUint16(26, true) + h.getUint16(28, true);
      const raw = file.slice(s, s + e.csize, type || '');
      if (e.method === 0) return raw;
      if (e.method === 8 && typeof DecompressionStream !== 'undefined') {
        const b = await new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
        return new Blob([b], { type: type || '' });
      }
      throw new Error('Unsupported zip file');
    }
  };
}

async function exportData() {
  if (!cards.length) { toast('No cards to export'); return; }
  const now = new Date();
  const ymd = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  const name = 'Picards-' + ymd + '.zip';
  let blob;
  try {
    const z = zipWriter();
    const data = { app: 'Picards', ver: 1, date: now.toISOString(), albums, cards };
    await z.add('data.json', new TextEncoder().encode(JSON.stringify(data, null, 1)));
    for (let i = 0; i < cards.length; i++) {
      toast(`Preparing backup ${i + 1} / ${cards.length}…`, true);
      const id = cards[i].id;
      const im = await getOne('imgs', id), th = await getOne('thumbs', id);
      if (im) await z.add(`cards/${id}.jpg`, im.b);
      if (th) await z.add(`thumbs/${id}.jpg`, th.b);
    }
    blob = z.finish();
  } catch (err) {
    toast('Export failed');
    return;
  }
  toast(`Backup ready (${(blob.size / 1048576).toFixed(1)} MB)`);
  try {
    const file = new File([blob], name, { type: 'application/zip' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return;
    }
  } catch (e) {
    if (e.name === 'AbortError') return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

$('#fileIn').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  let z, base, inAlbums, inCards;
  try {
    z = await zipRead(f);
    const dj = z.names.find(n => n === 'data.json' || n.endsWith('/data.json'));
    base = dj.slice(0, -'data.json'.length);    // zip nén lại trên máy tính có thể có thêm thư mục ở đầu
    const d = JSON.parse(await (await z.get(dj)).text());
    if (d.app !== 'Picards' || !Array.isArray(d.albums) || !Array.isArray(d.cards)) throw new Error();
    inAlbums = d.albums.filter(a => a && a.id).map(a => ({ id: String(a.id), name: String(a.name || 'Album'), order: Number(a.order) || 0 }));
    inCards = d.cards.filter(c => c && c.id).map(c => ({ id: String(c.id), album: String(c.album || ''), name: String(c.name || ''),
      order: Number(c.order) || 0, added: Number(c.added) || Date.now(), size: Number(c.size) || 0 }));
  } catch (err) {
    toast('Invalid file');
    return;
  }
  const r = await ask({
    title: 'Import backup',
    msg: `The file has ${inAlbums.length} albums and ${inCards.length} cards. What do you want to do?`,
    buttons: [{ label: 'Cancel', value: null }, { label: 'Replace all', value: 'rep', cls: 'danger' }, { label: 'Merge', value: 'merge', cls: 'primary' }]
  });
  if (!r.btn) return;
  if (r.btn === 'rep') {
    if (!(await confirmDlg('Replace all', 'All current albums and cards will be deleted and replaced by the backup. Continue?', 'Replace'))) return;
    await write(['albums', 'cards', 'imgs', 'thumbs'].map(s => [s, 'clear']));
    [...thumbUrls.keys()].forEach(dropThumb);
    albums = [];
    cards = [];
  }
  // Gộp: album / thẻ đã có (cùng id) thì giữ nguyên, chỉ thêm cái chưa có
  let o = nextOrder(albums);
  inAlbums.sort(byOrder).forEach(a => { if (!albumById(a.id)) { a.order = o++; albums.push(a); } });
  await write(inAlbums.map(a => ['albums', 'put', albumById(a.id)]));
  const have = new Set(cards.map(c => c.id));
  const todo = inCards.filter(c => !have.has(c.id));
  let ok = 0, bad = 0;
  for (let i = 0; i < todo.length; i++) {
    toast(`Importing ${i + 1} / ${todo.length}…`, true);
    const c = todo[i];
    try {
      const b = await z.get(`${base}cards/${c.id}.jpg`, 'image/jpeg');
      if (!b) throw new Error();
      const t = (await z.get(`${base}thumbs/${c.id}.jpg`, 'image/jpeg')) || await toJpeg(await loadImage(b), THUMB_MAX, 0.8);
      if (!albumById(c.album)) {                 // thẻ không thuộc album nào → album "Imported"
        let a = albums.find(x => x.name === 'Imported');
        if (!a) { a = { id: uid(), name: 'Imported', order: nextOrder(albums) }; albums.push(a); await write([['albums', 'put', a]]); }
        c.album = a.id;
      }
      c.size = b.size + t.size;
      await write([['imgs', 'put', { id: c.id, b }], ['thumbs', 'put', { id: c.id, b: t }], ['cards', 'put', c]]);
      cards.push(c);
      ok++;
    } catch (err) {
      if (isFull(err)) { toast('Storage is full'); break; }
      bad++;
    }
  }
  toast(`Imported ${ok} cards` + (bad ? ` (${bad} failed)` : ''));
  location.hash = '';
  render();
};

// ===== Khởi động =====
applyOpt();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./sw.js');
}
(async () => {
  try {
    albums = await getAll('albums');
    cards = await getAll('cards');
    if (!opt.init) {                             // lần đầu mở app: tạo sẵn 1 album
      if (!albums.length) {
        const a = { id: uid(), name: 'My cards', order: 0 };
        await write([['albums', 'put', a]]);
        albums.push(a);
      }
      opt.init = true;
      saveOpt();
    }
  } catch (e) {
    setBar('Picards', null, []);
    app.innerHTML = '<p class="empty">Cannot open storage on this device.</p>';
    return;
  }
  render();
})();
</script>
