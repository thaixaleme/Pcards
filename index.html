<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Picards">
<meta name="theme-color" content="#FFD400">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Picards</title>
<style>
/* Tông màu Pikachu: vàng (--y), nâu đậm (--brown), đỏ má Pikachu (--red) */
:root{--y:#FFD400;--y2:#FFB800;--brown:#3B2A00;--red:#E3350D;--bg:#FFF6C9;--card:#fff;--text:#2a2000;--muted:#7a6a3a;--line:#f0e2a8;--tile:#f4ecd0;--danger:#dc2626;
  --page-bg:radial-gradient(circle at 20% 0%,#fffbe0,transparent 60%),linear-gradient(180deg,#FFF6C9,#FFE98A)}
@media (prefers-color-scheme:dark){
:root{--bg:#1b1606;--card:#2a2410;--text:#f5ecd0;--muted:#b9a970;--line:#3d341a;--tile:#3a3218;--danger:#f87171;
  --page-bg:radial-gradient(circle at 20% 0%,#3a2e00,transparent 60%),linear-gradient(180deg,#221b05,#120e02)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:env(safe-area-inset-bottom)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--page-bg)}
body.lock{overflow:hidden}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  background:linear-gradient(180deg,#FFE033,var(--y));box-shadow:0 2px 0 var(--y2),0 6px 14px -6px rgba(150,100,0,.5)}
header h1{flex:1;margin:0 4px;font-size:20px;font-weight:900;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--brown)}
header h1 b{color:var(--red)}
header h1 .bolt{display:inline-block;margin-right:4px;animation:zap 2.6s infinite}
@keyframes zap{0%,86%,100%{transform:none}90%{transform:scale(1.25) rotate(-8deg)}}
main{max-width:900px;margin:0 auto;padding:12px 12px 100px}
/* Màn hình vừa 1 màn hình (sổ album): không cuộn */
main.fill{display:flex;flex-direction:column;padding-bottom:10px;height:calc(100vh - var(--hh,57px) - env(safe-area-inset-bottom));height:calc(100dvh - var(--hh,57px) - env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.icon{background:none;border:0;font-size:22px;min-width:40px;height:40px;border-radius:10px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
header .icon{background:rgba(255,255,255,.55);color:var(--brown);min-width:38px;height:38px;border-radius:12px;font-size:18px;font-weight:800}
header .icon.text{font-size:15px;padding:0 10px}
header .icon:disabled{opacity:.4}
#back{font-size:30px;line-height:1;padding-bottom:3px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:700}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;margin:10px 0}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
.center{text-align:center}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
input[type=text],select{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);min-width:0}
input[type=text]{display:block;width:100%;margin-top:4px}
label,.label{display:block;margin:10px 0;font-size:14px;color:var(--muted)}
label select{display:block;width:100%;margin-top:4px}
#prog{position:fixed;left:0;top:0;z-index:30;height:4px;width:100%;transform-origin:left;transform:scaleX(0);transition:transform .3s;
  background:linear-gradient(90deg,var(--y),var(--red));box-shadow:0 0 8px var(--y)}

/* Nút chọn (4 / 9 / 12 / 16 ô, kiểu trình chiếu...) */
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chips button{border:2px solid var(--brown);background:#fff;color:var(--brown);border-radius:20px;padding:4px 12px;font-weight:800;font-size:13px}
.chips button.on{background:var(--brown);color:var(--y)}
@media (prefers-color-scheme:dark){.chips button{border-color:var(--y);background:transparent;color:var(--y)}.chips button.on{background:var(--y);color:var(--brown)}}

/* ===== Sổ album: trang có N ô bọc nhựa, mép trái có lỗ còng, lật trang như sách ===== */
.binder{position:relative;flex:1;min-height:0;margin-top:10px;perspective:1600px}
.book{position:absolute;inset:0 0 58px 0;touch-action:none}
.page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;container-type:size;
  border-radius:6px 16px 16px 6px;padding:12px 12px 12px 24px;transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:linear-gradient(90deg,#d9c36a 0,#f3e6a6 10px,#fffdf3 22px,#fffdf3);box-shadow:0 8px 20px -6px rgba(90,60,0,.45),inset 0 0 0 2px #e8d48a;
  transition:transform .8s cubic-bezier(.45,.05,.3,1)}
.page::before{content:'';position:absolute;left:7px;top:8%;bottom:8%;width:6px;background:radial-gradient(circle,#a88a2a 2.5px,transparent 3px) 0 0/6px 16.6%}
.page.turn{transform:rotateY(-170deg)}
.page.back{transform:rotateY(-170deg);transition:none}
.pockets{display:grid;gap:7px;width:100%;width:min(100%,calc((100cqh - 7px * (var(--r) - 1)) * 0.716 * var(--c) / var(--r)));grid-template-columns:repeat(var(--c),1fr)}
.pocket{position:relative;border-radius:6px;aspect-ratio:63/88;background:#f4ecd0;box-shadow:inset 0 1px 3px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pocket img{width:90%;aspect-ratio:63/88;object-fit:cover;border-radius:5px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.pocket::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:6px;   /* tấm nhựa bọc thẻ: bóng sáng chéo */
  background:linear-gradient(125deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.25) 100%)}
.pocket.add{font-size:30px;font-weight:900;color:#c9a227;box-shadow:inset 0 0 0 2px #e8d48a;background:repeating-linear-gradient(45deg,#fff9df,#fff9df 6px,#fff2c0 6px,#fff2c0 12px);cursor:pointer}
.pnav{position:absolute;left:0;right:0;bottom:4px;display:flex;align-items:center;justify-content:center;gap:16px}
.pnav button{width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:var(--y);color:var(--brown);font-size:22px;font-weight:900;box-shadow:0 3px 8px rgba(150,100,0,.4)}
.pnav button:disabled{opacity:.35}
.pnav span{font-weight:800;color:var(--brown);min-width:84px;text-align:center;font-size:15px}
.pnav small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
@media (prefers-color-scheme:dark){.pnav span{color:var(--y)}}

/* ===== Sắp xếp: lưới thẻ chia theo trang, nhấn giữ rồi kéo để đổi chỗ ===== */
.egrid{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:8px;-webkit-user-select:none;user-select:none}
.egrid .ph{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--muted);margin:8px 0 -2px}
.et{position:relative;aspect-ratio:63/88;border-radius:8px;overflow:hidden;background:var(--tile);box-shadow:0 2px 6px rgba(0,0,0,.25);-webkit-touch-callout:none}
.et img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.et .no{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:0 6px;border-radius:8px}
.et .nm{position:absolute;left:0;right:0;bottom:0;padding:10px 5px 3px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.et.sel{outline:3px solid var(--red);outline-offset:-3px}
.et.sel::after{content:'✓';position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;font-weight:800;text-align:center;line-height:22px}
.et.gap{background:repeating-linear-gradient(45deg,#fff6c9,#fff6c9 6px,#ffe98a 6px,#ffe98a 12px);box-shadow:inset 0 0 0 2px var(--y2)}
.et.gap>*{visibility:hidden}
.et.ghost{position:fixed;z-index:40;pointer-events:none;margin:0;transform:scale(1.12) rotate(-4deg);box-shadow:0 12px 26px rgba(0,0,0,.45);outline:3px solid var(--red)}
.ebar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:2px solid var(--y)}

/* Settings */
.sect{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px 10px;margin-bottom:14px}
.sect h3{margin:10px 0 4px;font-size:15px}
.set{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line)}
.set:last-of-type{border-bottom:0}
label.set{margin:0;font-size:16px;color:var(--text)}
.sw{position:relative;flex:none;width:50px;height:30px}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:.2s;pointer-events:none}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+i{background:var(--red)}
.sw input:checked+i::after{left:23px}

/* Màn hình toàn màn hình (xem thẻ, trình chiếu) */
.ov{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column;touch-action:none;-webkit-user-select:none;user-select:none}
.ov .icon{color:#fff}
.ov .top{display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px}
.ov .cnt{font-size:15px;opacity:.8;padding-left:6px}
.ov .stage{flex:1;position:relative;overflow:hidden}
#vImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center}
.ov .vname{text-align:center;padding:8px 12px calc(14px + env(safe-area-inset-bottom));min-height:46px;font-weight:600}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:34px}
.nav.l{left:8px}
.nav.r{right:8px}
@media (hover:none){.nav{display:none}}
#show{display:block;background:radial-gradient(circle at 50% 40%,#3a2e00,#000 75%)}
#stage{position:absolute;inset:0;perspective:1400px;overflow:hidden}
#stage .sl{position:absolute;left:50%;top:48%;max-width:92%;max-height:84%;border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.6);
  transform:translate(-50%,-50%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
#stage .page{inset:calc(env(safe-area-inset-top) + 56px) 14px calc(env(safe-area-inset-bottom) + 70px) 14px}
.shname{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));text-align:center;font-size:18px;font-weight:800;text-shadow:0 1px 4px #000,0 0 12px #000;padding:0 16px;pointer-events:none}
.ctl{position:absolute;inset:0;pointer-events:none;transition:opacity .3s}
.ctl.hide{opacity:0}
.ctl:not(.hide) button{pointer-events:auto}
.ctl .top{position:absolute;left:0;right:0;top:0;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.ctl .bot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:28px;padding:30px 0 calc(70px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6))}
.ctl .bot .icon{width:56px;height:56px;border-radius:50%;background:var(--y);color:var(--brown);font-size:22px;border:3px solid #fff}

dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(40,30,0,.5)}
dialog h2{margin:0 0 6px;font-size:18px}
#dlgBody p{margin:6px 0;white-space:pre-line}
#dlgBody .chips{justify-content:flex-start;margin:6px 0 4px}
#dlgBody .chips button{padding:7px 12px;font-size:14px}
#dlgBtns{justify-content:flex-end;flex-wrap:wrap;margin-bottom:0}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(40,30,0,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){header h1 .bolt{animation:none}}
</style>
</head>
<body>
<header>
  <button id="back" class="icon" hidden aria-label="Back">‹</button>
  <h1 id="title">Picards</h1>
  <div id="actions"></div>
</header>
<main id="app"></main>

<!-- Xem thẻ: vuốt trái / phải để chuyển, vuốt xuống để đóng, chụm 2 ngón hoặc chạm 2 lần để phóng to -->
<div id="view" class="ov" hidden>
  <div class="top">
    <button class="icon" id="vClose" aria-label="Close">✕</button>
    <span class="grow cnt" id="vCnt"></span>
    <button class="icon" id="vPlay" aria-label="Slideshow">▶&#xFE0E;</button>
    <button class="icon" id="vName" aria-label="Rename">✎</button>
    <button class="icon" id="vDel" aria-label="Delete">🗑</button>
  </div>
  <div class="stage" id="vStage">
    <img id="vImg" alt="">
    <button class="nav l" id="vPrev" aria-label="Previous">‹</button>
    <button class="nav r" id="vNext" aria-label="Next">›</button>
  </div>
  <div class="vname" id="vCap"></div>
</div>

<!-- Trình chiếu: mỗi ảnh / trang là 1 phần tử trong #stage, hiệu ứng theo kiểu đã chọn. Chạm vào màn hình để hiện / ẩn nút -->
<div id="show" class="ov" hidden>
  <div id="stage"></div>
  <div class="shname" id="shName"></div>
  <div class="ctl" id="shCtl">
    <div class="top"><span class="grow cnt" id="shCnt"></span><button class="icon" id="shClose" aria-label="Close">✕</button></div>
    <div class="bot">
      <button class="icon" id="shPrev" aria-label="Previous">◀&#xFE0E;</button>
      <button class="icon" id="shPause" aria-label="Pause"></button>
      <button class="icon" id="shNext" aria-label="Next">▶&#xFE0E;</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <div id="dlgBody"></div>
  <div class="row" id="dlgBtns"></div>
</dialog>
<input type="file" id="addIn" accept="image/*" multiple hidden>
<input type="file" id="fileIn" accept=".zip,application/zip" hidden>
<div id="toast"></div>
<div id="prog"></div>

<script>
'use strict';
const VERSION = '2.0';
const OPT_KEY = 'picards-opt-v1';
const DB_NAME = 'picards';
const IMG_MAX = 1800;   // cạnh dài tối đa của ảnh thẻ khi lưu (px)
const THUMB_MAX = 480;  // cạnh dài tối đa của ảnh nhỏ dùng trong sổ album / danh sách (px)
const PLAY = '▶︎', PAUSE = '❚❚';
// Số ô mỗi trang sổ album → [số cột, số hàng]
const GRID = { 4: [2, 2], 9: [3, 3], 12: [3, 4], 16: [4, 4] };
// Kiểu trình chiếu
const MODES = [['fade', 'Fade'], ['slide', 'Slide'], ['flip', 'Card flip'], ['deal', 'Deal'], ['pages', 'Album pages'], ['spin', 'Spin 3D']];

const $ = s => document.querySelector(s);
const app = $('#app');

// ===== Cài đặt (lưu trong localStorage) =====
// per: số ô mỗi trang sổ album, mode: kiểu trình chiếu
const OPT_DEFAULT = { sec: 5, shuffle: false, motion: true, showName: true, per: 9, mode: 'fade', init: false };
let opt = Object.assign({}, OPT_DEFAULT, load(OPT_KEY));
if (!GRID[opt.per]) opt.per = 9;
if (!MODES.some(m => m[0] === opt.mode)) opt.mode = 'fade';
function load(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}
function saveOpt() {
  try { localStorage.setItem(OPT_KEY, JSON.stringify(opt)); } catch (e) {}
}

// ===== Lưu dữ liệu bằng IndexedDB =====
// albums: {id, name, order}  (chỉ dùng 1 album = sổ album Pikachu; dữ liệu cũ nhiều album được gộp lại lúc mở app)
// cards : {id, album, name, order, added, size}   (order: vị trí trong sổ 0, 1, 2...; size: dung lượng ảnh + ảnh nhỏ, byte)
// imgs  : {id, b}  ảnh thẻ (Blob JPEG)      thumbs: {id, b}  ảnh nhỏ (Blob JPEG)
// Thông tin album / thẻ được đọc hết vào bộ nhớ lúc mở app, ảnh thì chỉ đọc khi cần hiện.
let albums = [], cards = [];
let idbp = null;
function idb() {
  if (!idbp) idbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      ['albums', 'cards', 'imgs', 'thumbs'].forEach(n => d.createObjectStore(n, { keyPath: 'id' }));
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return idbp;
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function getAll(store) {
  const d = await idb();
  return reqP(d.transaction(store).objectStore(store).getAll());
}
async function getOne(store, id) {
  const d = await idb();
  return reqP(d.transaction(store).objectStore(store).get(id));
}
// ops: [[tên bảng, 'put' | 'delete' | 'clear', giá trị], ...]  ghi tất cả trong 1 lần (lỗi thì không ghi gì)
async function write(ops) {
  if (!ops.length) return;
  const d = await idb();
  const names = [...new Set(ops.map(o => o[0]))];
  return new Promise((res, rej) => {
    const t = d.transaction(names, 'readwrite');
    ops.forEach(([s, op, v]) => op === 'clear' ? t.objectStore(s).clear() : t.objectStore(s)[op](v));
    t.oncomplete = () => res();
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('Aborted'));
  });
}
const isFull = e => e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''));

// Gộp tất cả thẻ vào 1 album (giữ thứ tự: theo thứ tự album cũ rồi thứ tự thẻ), đánh lại vị trí 0, 1, 2...
async function unifyAlbum() {
  const list = [...albums].sort(byOrder);
  let main = list[0];
  const ops = [];
  if (!main) {
    main = { id: uid(), name: 'Pikachu', order: 0 };
    ops.push(['albums', 'put', main]);
  }
  const ao = new Map(list.map(a => [a.id, a.order]));
  const ordered = [...cards].sort((a, b) => ((ao.get(a.album) || 0) - (ao.get(b.album) || 0)) || a.order - b.order);
  ordered.forEach((c, i) => {
    if (c.album !== main.id || c.order !== i) { c.album = main.id; c.order = i; ops.push(['cards', 'put', c]); }
  });
  list.slice(1).forEach(a => ops.push(['albums', 'delete', a.id]));
  await write(ops);
  albums = [main];
}
const mainId = () => albums[0].id;

// ===== Ảnh =====
const thumbUrls = new Map(); // id thẻ → URL ảnh nhỏ (giữ lại để không phải đọc lại)
async function thumbUrl(id) {
  if (!thumbUrls.has(id)) {
    const r = await getOne('thumbs', id);
    if (!thumbUrls.has(id)) thumbUrls.set(id, r ? URL.createObjectURL(r.b) : '');
  }
  return thumbUrls.get(id);
}
function dropThumb(id) {
  const u = thumbUrls.get(id);
  if (u) URL.revokeObjectURL(u);
  thumbUrls.delete(id);
}
// URL ảnh lớn. Người gọi phải tự URL.revokeObjectURL khi không dùng nữa.
async function imgUrl(id) {
  const r = (await getOne('imgs', id)) || (await getOne('thumbs', id));
  return r ? URL.createObjectURL(r.b) : '';
}
function setThumb(el) {
  const u = thumbUrls.get(el.dataset.t);
  if (u) el.src = u;
  else thumbUrl(el.dataset.t).then(x => { if (x) el.src = x; });
}
// Chỉ đọc ảnh nhỏ khi ô thẻ sắp hiện trên màn hình (danh sách nhiều thẻ vẫn mở nhanh)
const thumbIO = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  thumbIO.unobserve(e.target);
  setThumb(e.target);
}), { rootMargin: '600px 0px' }) : null;
function fillThumbs(root) {
  (root || app).querySelectorAll('img[data-t]').forEach(el => {
    if (thumbIO && !thumbUrls.has(el.dataset.t)) thumbIO.observe(el); else setThumb(el);
  });
}

// Đọc ảnh. decode(): giải mã ảnh ở luồng nền, không làm đứng màn hình
async function loadImage(blob) {
  const url = URL.createObjectURL(blob);
  const im = new Image();
  const loaded = new Promise((res, rej) => { im.onload = res; im.onerror = rej; });
  im.src = url;
  try {
    if (im.decode) await im.decode().catch(() => loaded);
    else await loaded;
    if (!im.naturalWidth) throw new Error();
    return im;
  } catch (e) {
    throw new Error('Cannot read image');
  } finally {
    URL.revokeObjectURL(url);
  }
}
// Vẽ ảnh (hoặc canvas) sang canvas mới, cạnh dài ≤ max
function drawScaled(src, max) {
  const w0 = src.naturalWidth || src.width, h0 = src.naturalHeight || src.height;
  const s = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w0 * s));
  c.height = Math.max(1, Math.round(h0 * s));
  const g = c.getContext('2d');
  g.fillStyle = '#fff';               // ảnh PNG nền trong suốt → nền trắng
  g.fillRect(0, 0, c.width, c.height);
  g.drawImage(src, 0, 0, c.width, c.height);
  return c;
}
// Canvas → JPEG, xong thì giải phóng canvas (iPhone giới hạn bộ nhớ canvas)
function canvasJpeg(c, q) {
  return new Promise((res, rej) => c.toBlob(b => {
    c.width = c.height = 0;
    b ? res(b) : rej(new Error('Cannot convert image'));
  }, 'image/jpeg', q));
}
// Thu nhỏ ảnh (cạnh dài ≤ max) và chuyển thành JPEG
const toJpeg = (im, max, q) => canvasJpeg(drawScaled(im, max), q);
// Ảnh thẻ + ảnh nhỏ. Ảnh gốc (12MP...) chỉ vẽ 1 lần; ảnh nhỏ tạo từ ảnh đã thu nhỏ (nhanh hơn nhiều)
async function makeCardImages(file) {
  const im = await loadImage(file);
  const big = drawScaled(im, IMG_MAX);
  const small = drawScaled(big, THUMB_MAX);
  const t = await canvasJpeg(small, 0.8);
  const b = await canvasJpeg(big, 0.88);
  return { b, t };
}
const idle = () => new Promise(r => setTimeout(r, 30)); // nhường cho màn hình xử lý thao tác bấm
function progress(done, total) {
  const p = $('#prog');
  p.style.transform = `scaleX(${total ? done / total : 0})`;
  if (done >= total) setTimeout(() => { p.style.transform = 'scaleX(0)'; }, 600);
}

// ===== Tiện ích =====
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const byOrder = (a, b) => a.order - b.order;
const allCards = () => [...cards].sort(byOrder);    // tất cả thẻ theo vị trí trong sổ
const cardById = id => cards.find(c => c.id === id);
const nextOrder = list => list.reduce((m, x) => Math.max(m, x.order), -1) + 1;

let toastTimer;
function toast(msg, stay) {

// actions: [[nội dung nút, nhãn, hàm, class thêm], ...]
function setBar(title, backHash, actions) {

// Chuyển màn hình. Nếu #hash không đổi (sự kiện hashchange không chạy) thì tự vẽ lại
function go(hash) {

// Hộp thoại chung: trả về Promise {btn, v}
// fields: [{name, label, value, ph, max, select: [[giá trị, nhãn], ...], choice: [[giá trị, nhãn], ...] (hàng nút chọn)}]
// buttons: [{label, value, cls}]  (nút có cls 'primary' được chọn khi bấm Enter)
function ask({ title, msg, fields = [], buttons }) {
  return new Promise(resolve => {
    const d = $('#dlg');
    const finish = btn => {
      const v = {};
      d.querySelectorAll('[name]').forEach(el => { v[el.name] = el.value.trim(); });
      d.oncancel = null;
      d.close();
      resolve({ btn, v });
    };
    d.oncancel = e => { e.preventDefault(); finish(null); };
    $('#dlgTitle').textContent = title;
    $('#dlgBody').innerHTML = (msg ? `<p>${esc(msg)}</p>` : '') + fields.map(f => f.choice
      ? `<div class="label">${esc(f.label)}</div><input type="hidden" name="${f.name}" value="${esc(f.value)}">
          <div class="chips">${f.choice.map(([v, l]) => `<button type="button" data-v="${esc(v)}" class="${v === f.value ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>`
      : f.select
      ? `<label>${esc(f.label)}<select name="${f.name}">${f.select.map(([v, l]) =>
          `<option value="${esc(v)}" ${v === f.value ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`
      : `<label>${esc(f.label)}<input type="text" name="${f.name}" value="${esc(f.value || '')}" placeholder="${esc(f.ph || '')}"
          maxlength="${f.max || 40}" autocomplete="off"></label>`).join('');
    d.querySelectorAll('#dlgBody .chips').forEach(ch => ch.onclick = e => {
      const b = e.target.closest('button');
      if (!b) return;
      ch.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      ch.previousElementSibling.value = b.dataset.v;
    });
    const box = $('#dlgBtns');
    box.innerHTML = '';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (b.cls || '');
      btn.textContent = b.label;
      btn.onclick = () => finish(b.value);
      box.appendChild(btn);
    });
    const pri = buttons.find(b => (b.cls || '').includes('primary'));
    d.querySelectorAll('input').forEach(el => el.onkeydown = e => {
      if (e.key === 'Enter' && pri) { e.preventDefault(); finish(pri.value); }
    });
    d.showModal();
    const first = d.querySelector('input[type=text]');
    if (first) { first.focus(); first.select(); }
  });
}
async function confirmDlg(title, msg, okLabel) {
  const r = await ask({ title, msg, buttons: [{ label: 'Cancel', value: null }, { label: okLabel, value: 'ok', cls: 'primary' }] });
  return r.btn === 'ok';
}

// ===== Điều hướng (theo #hash): '' sổ album, 'edit' sắp xếp, 'set' Settings =====
let sel = new Set();     // sắp xếp: id thẻ đang chọn
window.addEventListener('hashchange', () => { sel = new Set(); render(); window.scrollTo(0, 0); });
function render() {
  const page = location.hash.slice(1);

  else if (page === 'set') renderSettings();

const pickPhotos = () => $('#addIn').click();

// ===== Sổ album (màn hình chính) =====
let pg = 0;          // trang đang mở
let flipping = false;
const pageCount = () => Math.max(1, Math.ceil(cards.length / opt.per));
// HTML các ô của 1 trang. add: ô trống đầu tiên sau thẻ cuối cùng hiện nút ＋
function pocketsHtml(list, p, per, add) {
  const [c, r] = GRID[per];
  let h = '';
  for (let k = 0; k < per; k++) {
    const i = p * per + k, cd = list[i];
    if (cd) h += `<div class="pocket" data-c="${cd.id}"><img data-t="${cd.id}" alt=""></div>`;
    else if (add && i === list.length) h += '<div class="pocket add" aria-label="Add cards">＋</div>';
    else h += '<div class="pocket"></div>';
  }
  return `<div class="pockets" style="--c:${c};--r:${r}">${h}</div>`;
}
function pageEl(list, p) {
  const el = document.createElement('div');
  el.className = 'page';
  el.innerHTML = pocketsHtml(list, p, opt.per, true);
  el.querySelectorAll('img[data-t]').forEach(setThumb);
  return el;
}
function renderBinder() {
  setBar('', null, [
    ['＋', 'Add cards', pickPhotos],
    ...(cards.length ? [[PLAY, 'Slideshow', () => chooseShow(allCards(), pg * opt.per)], ['✎', 'Arrange cards', () => go('edit')]] : []),
    ['⚙', 'Settings', () => go('set')]
  ]);
  $('#title').innerHTML = '<span class="bolt">⚡</span>Pi<b>cards</b>';
  app.className = 'fill';
  app.innerHTML = `
    <div class="chips" id="per">${Object.keys(GRID).map(n => `<button data-n="${n}" class="${+n === opt.per ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div class="binder">
      <div class="book" id="book"></div>
      <div class="pnav"><button id="pPrev" aria-label="Previous page">‹</button><span id="pno"></span><button id="pNext" aria-label="Next page">›</button></div>
    </div>`;
  $('#per').onclick = e => {
    const b = e.target.closest('button');
    if (!b || +b.dataset.n === opt.per) return;
    const first = pg * opt.per;              // giữ thẻ đầu trang hiện tại vẫn nằm trong trang mới
    opt.per = +b.dataset.n;
    saveOpt();
    pg = Math.floor(first / opt.per);
    renderBinder();
  };
  $('#pPrev').onclick = () => flip(-1);
  $('#pNext').onclick = () => flip(1);
  bookEvents($('#book'));
  drawBook();
}
function drawBook() {
  const book = $('#book');
  if (!book) return;
  pg = Math.min(pg, pageCount() - 1);
  const list = allCards();
  book.innerHTML = '';
  book.appendChild(pageEl(list, pg));
  $('#pno').innerHTML = `Page ${pg + 1} / ${pageCount()}<small>${cards.length} cards</small>`;
  $('#pPrev').disabled = pg === 0;
  $('#pNext').disabled = pg >= pageCount() - 1;
  // đọc trước ảnh nhỏ của trang trước / sau để lật trang không bị trống
  [pg - 1, pg + 1].forEach(p => list.slice(p * opt.per, (p + 1) * opt.per).forEach(c => thumbUrl(c.id)));
}
// Lật trang. Sang trang sau: trang hiện tại xoay quanh mép trái để lộ trang sau nằm bên dưới.
// Về trang trước: trang trước lật từ bên trái trở lại đè lên trang hiện tại.
function flip(d) {
  const to = pg + d;
  if (flipping || to < 0 || to >= pageCount()) return;
  flipping = true;
  const book = $('#book'), list = allCards();
  const el = pageEl(list, to);
  if (d > 0) {
    book.insertBefore(el, book.firstChild);
    const top = book.lastElementChild;
    requestAnimationFrame(() => requestAnimationFrame(() => top.classList.add('turn')));
  } else {
    el.classList.add('back');
    book.appendChild(el);
    void el.offsetWidth;
    el.classList.remove('back');
  }
  setTimeout(() => { pg = to; flipping = false; drawBook(); }, 830);
}
// Vuốt trái / phải: lật trang. Chạm vào thẻ: xem to. Chạm ô ＋: thêm ảnh
function bookEvents(book) {
  let p0 = null, swiped = false;
  book.addEventListener('pointerdown', e => { p0 = { x: e.clientX, y: e.clientY }; swiped = false; });
  book.addEventListener('pointerup', e => {
    if (!p0) return;
    const dx = e.clientX - p0.x, dy = e.clientY - p0.y;
    p0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { swiped = true; flip(dx < 0 ? 1 : -1); }
  });
  book.addEventListener('click', e => {
    if (swiped || flipping) { swiped = false; return; }
    const pk = e.target.closest('.pocket');
    if (!pk) return;
    if (pk.dataset.c) {
      const list = allCards();
      openViewer(list, list.findIndex(c => c.id === pk.dataset.c));
    } else if (pk.classList.contains('add')) pickPhotos();
  });
}

// ===== Sắp xếp: nhấn giữ thẻ rồi kéo để đổi chỗ, chạm để chọn (xóa / đặt tên) =====
function renderEdit() {
  const list = allCards();
  setBar('Arrange', '', [
    ['＋', 'Add cards', pickPhotos],
    ['All', 'Select all', () => { sel = sel.size === list.length ? new Set() : new Set(list.map(c => c.id)); renderEdit(); }, 'text']
  ]);
  const [c] = GRID[opt.per];
  let h = '';
  list.forEach((cd, i) => {

  });

    ? `<p class="muted">Touch and hold a card, then drag it to a new place. Tap cards to select them.</p>
       <div class="egrid" id="egrid" style="--c:${c}">${h}</div>`
    : '<p class="empty">No cards yet.<br>Tap ＋ to add photos of your cards.</p>';
  app.insertAdjacentHTML('beforeend', `<div class="ebar">
    <button class="btn" id="eName">Name</button>
    <button class="btn danger" id="eDel">Delete</button></div>`);
  $('#eName').onclick = async () => {
    const c1 = cardById([...sel][0]);
    if (c1 && (await renameCard(c1))) renderEdit();
  };
  $('#eDel').onclick = async () => {

    await deleteCards([...sel]);

}
function editTile(cd, i) {
  return `<div class="et ${sel.has(cd.id) ? 'sel' : ''}" data-c="${cd.id}"><img data-t="${cd.id}" alt="" draggable="false">
    <span class="no">${i + 1}</span>${cd.name ? `<span class="nm">${esc(cd.name)}</span>` : ''}</div>`;
}
function updEdit() {
  $('#title').textContent = sel.size ? `${sel.size} selected` : 'Arrange';
  $('#eName').disabled = sel.size !== 1;
  $('#eDel').disabled = !sel.size;
}
// Đánh lại vị trí thẻ 0, 1, 2... theo thứ tự hiện tại
async function renumber(ids) {
  const ops = [];
  (ids || allCards().map(c => c.id)).forEach((id, i) => {
    const c = cardById(id);
    if (c && c.order !== i) { c.order = i; ops.push(['cards', 'put', c]); }
  });
  await write(ops);
}

let drag = null; // thẻ đang kéo: {el (ô gốc, thành chỗ trống), g (bản sao bay theo ngón tay), ox, oy, x, y, raf}
function editEvents(grid) {
  let pd = null;   // đang nhấn (chưa đủ lâu để kéo)
  const cancel = () => { if (pd) clearTimeout(pd.timer); pd = null; };
  grid.addEventListener('pointerdown', e => {
    const t = e.target.closest('[data-c]');
    if (!t || drag || e.button > 0) return;
    pd = { t, x: e.clientX, y: e.clientY };
    pd.timer = setTimeout(() => { const p = pd; pd = null; startDrag(p.t, p.x, p.y); }, 400);
  });
  grid.addEventListener('pointermove', e => {
    if (pd && Math.hypot(e.clientX - pd.x, e.clientY - pd.y) > 8) cancel();    // ngón tay di chuyển sớm = đang cuộn trang
  });
  grid.addEventListener('pointerup', () => {
    if (!pd) return;
    const t = pd.t;
    cancel();
    const id = t.dataset.c;                      // chạm nhanh: chọn / bỏ chọn
    if (sel.has(id)) sel.delete(id); else sel.add(id);
    t.classList.toggle('sel', sel.has(id));
    updEdit();
  });
  grid.addEventListener('pointercancel', cancel);
  grid.addEventListener('contextmenu', e => e.preventDefault());
}
function startDrag(el, x, y) {
  const r = el.getBoundingClientRect();
  const g = el.cloneNode(true);
  g.classList.add('ghost');
  g.classList.remove('sel');
  g.style.width = r.width + 'px';
  g.style.height = r.height + 'px';
  document.body.appendChild(g);
  el.classList.add('gap');
  drag = { el, g, ox: x - r.left, oy: y - r.top, x, y, raf: 0 };
  if (navigator.vibrate) navigator.vibrate(15);
  dragFrame();
}
// Mỗi khung hình: thẻ bay theo ngón tay, chỗ trống dời tới vị trí dưới ngón tay, gần mép trên / dưới thì tự cuộn
function dragFrame() {
  if (!drag) return;
  const { g, el, x, y } = drag;
  g.style.left = (x - drag.ox) + 'px';
  g.style.top = (y - drag.oy) + 'px';
  if (y < 110) window.scrollBy(0, -10);
  else if (y > innerHeight - 110) window.scrollBy(0, 10);
  const t = document.elementFromPoint(x, y);
  const over = t && t.closest('#egrid [data-c]');
  if (over && over !== el) {
    const tiles = [...$('#egrid').querySelectorAll('[data-c]')];
    if (tiles.indexOf(el) < tiles.indexOf(over)) over.after(el); else over.before(el);
  }
  drag.raf = requestAnimationFrame(dragFrame);
}
function dragMove(x, y) { if (drag) { drag.x = x; drag.y = y; } }
async function endDrag() {
  if (!drag) return;
  const { el, g, raf } = drag;
  drag = null;
  cancelAnimationFrame(raf);
  g.remove();
  el.classList.remove('gap');
  await renumber([...$('#egrid').querySelectorAll('[data-c]')].map(x => x.dataset.c));
  renderEdit();
}
document.addEventListener('pointermove', e => dragMove(e.clientX, e.clientY));
document.addEventListener('touchmove', e => {         // đang kéo thẻ: không cho trang cuộn theo ngón tay
  if (!drag) return;
  e.preventDefault();
  dragMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
document.addEventListener('touchend', endDrag);

async function renameCard(c) {
  const r = await ask({ title: 'Card name', fields: [{ name: 'name', label: 'Name', value: c.name, ph: 'Pikachu V' }],
    buttons: [{ label: 'Cancel', value: null }, { label: 'Save', value: 'ok', cls: 'primary' }] });
  if (r.btn !== 'ok') return false;
  c.name = r.v.name;
  await write([['cards', 'put', c]]);
  return true;
}

async function deleteCards(ids) {
  const set = new Set(ids);
  await write(ids.flatMap(id => [['cards', 'delete', id], ['imgs', 'delete', id], ['thumbs', 'delete', id]]));
  ids.forEach(dropThumb);
  cards = cards.filter(c => !set.has(c.id));
}

// ===== Thêm thẻ (chọn nhiều ảnh cùng lúc từ Photos / camera), thêm vào cuối sổ =====
// Mỗi ảnh xong là hiện ngay. Trong lúc thêm vẫn bấm được nút khác (việc thêm ảnh tiếp tục chạy)
$('#addIn').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  let order = nextOrder(cards);
  if (location.hash === '' || location.hash === '#') { pg = Math.floor(order / opt.per); drawBook(); }  // mở trang có thẻ mới
  let ok = 0, bad = 0;
  progress(0, files.length);
  for (let i = 0; i < files.length; i++) {
    toast(`Adding ${i + 1} / ${files.length}…`, true);
    await idle();
    try {
      const { b, t } = await makeCardImages(files[i]);
      const c = { id: uid(), album: mainId(), name: '', order: order++, added: Date.now(), size: b.size + t.size };
      await write([['imgs', 'put', { id: c.id, b }], ['thumbs', 'put', { id: c.id, b: t }], ['cards', 'put', c]]);
      cards.push(c);
      ok++;
      showNewCard(c);
    } catch (err) {
      if (isFull(err)) { toast('Storage is full'); break; }
      bad++;
    }
    progress(i + 1, files.length);
  }
  progress(files.length, files.length);
  toast(`Added ${ok} cards` + (bad ? ` (${bad} could not be read)` : ''));
  if (!vw && !sh && !drag) render();          // vẽ lại nút trên thanh tiêu đề (▶, ✎...)
};
function showNewCard(c) {
  if (vw || sh || drag) return;
  if (location.hash === '#edit') return;      // vẽ lại 1 lần khi thêm xong
  if (!flipping && $('#book')) {
    const i = allCards().indexOf(c);
    if (Math.floor(i / opt.per) !== pg) pg = Math.floor(i / opt.per);
    drawBook();
  }
}

// ===== Xem thẻ =====
let vw = null; // {list, i, url}
let resetZoom = () => {};
function openViewer(list, i) {
  vw = { list: [...list], i, url: '' };
  $('#view').hidden = false;
  document.body.classList.add('lock');
  showCard();
}
async function showCard() {
  const v = vw, c = v.list[v.i];
  $('#vCnt').textContent = `${v.i + 1} / ${v.list.length}`;

// Thao tác chạm khi xem thẻ
(() => {
  const st = $('#vStage'), img = $('#vImg');
  let z = { s: 1, x: 0, y: 0 }, t0 = null, pinch = null, lastTap = 0;
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const apply = anim => {
    img.style.transition = anim ? 'transform .25s' : 'none';
    img.style.transform = `translate(${z.x}px,${z.y}px) scale(${z.s})`;
  };
  resetZoom = anim => { z = { s: 1, x: 0, y: 0 }; apply(anim); };
  st.addEventListener('touchstart', e => {
    if (e.touches.length === 2) { pinch = { d: dist(e.touches[0], e.touches[1]), s: z.s }; t0 = null; return; }
    if (e.touches.length > 2 || pinch) return;
    const p = e.touches[0];
    t0 = { x: p.clientX, y: p.clientY, zx: z.x, zy: z.y, t: Date.now(), dx: 0, dy: 0 };
  }, { passive: true });
  st.addEventListener('touchmove', e => {
    e.preventDefault();
    if (pinch && e.touches.length === 2) {
      z.s = Math.min(5, Math.max(1, pinch.s * dist(e.touches[0], e.touches[1]) / pinch.d));
      apply(false);
      return;
    }
    if (!t0) return;
    const p = e.touches[0];
    t0.dx = p.clientX - t0.x;
    t0.dy = p.clientY - t0.y;
    if (z.s > 1) { z.x = t0.zx + t0.dx; z.y = t0.zy + t0.dy; apply(false); return; }
    img.style.transition = 'none';
    img.style.transform = `translate(${t0.dx}px,${Math.max(0, t0.dy)}px)`;   // kéo ảnh theo ngón tay
  }, { passive: false });
  st.addEventListener('touchend', e => {
    if (pinch) {
      if (!e.touches.length) { pinch = null; if (z.s < 1.05) resetZoom(true); }
      return;
    }
    if (!t0) return;
    const { dx, dy } = t0;
    const quick = Date.now() - t0.t < 300;
    t0 = null;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && quick) {     // chạm 2 lần: phóng to / thu nhỏ tại chỗ chạm
      const now = Date.now();
      if (now - lastTap > 300) { lastTap = now; if (z.s === 1) apply(true); return; }
      lastTap = 0;
      if (z.s > 1) { resetZoom(true); return; }
      const r = st.getBoundingClientRect(), p = e.changedTouches[0];
      z.s = 2.5;
      z.x = (p.clientX - r.left - r.width / 2) * (1 - z.s);
      z.y = (p.clientY - r.top - r.height / 2) * (1 - z.s);
      apply(true);
      return;
    }
    if (z.s > 1) return;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) viewGo(dx < 0 ? 1 : -1);
    else if (dy > 120 && dy > Math.abs(dx)) closeViewer();
    else resetZoom(true);
  });
})();

// ===== Trình chiếu =====
// Mỗi bước tạo 1 phần tử mới (ảnh thẻ, hoặc 1 trang sổ album ở kiểu 'pages') rồi chạy hiệu ứng vào / ra theo kiểu đã chọn.
let sh = null; // {list, i (thẻ / trang đang hiện), mode, tok, timer, paused, lock, hideT}
async function chooseShow(list, i) {
  const r = await ask({ title: 'Slideshow', fields: [{ name: 'mode', label: 'Style', choice: MODES, value: opt.mode }],
    buttons: [{ label: 'Cancel', value: null }, { label: 'Start', value: 'ok', cls: 'primary' }] });
  if (r.btn !== 'ok') return;
  opt.mode = r.v.mode;
  saveOpt();
  startShow(list, i);
}
function startShow(list, i) {
  if (!list.length) return;
  list = [...list];
  i = Math.min(Math.max(0, i), list.length - 1);
  if (opt.shuffle) {
    const first = list.splice(i, 1)[0];        // thẻ được chọn hiện đầu tiên, các thẻ còn lại trộn ngẫu nhiên
    for (let k = list.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [list[k], list[j]] = [list[j], list[k]]; }
    list.unshift(first);
    i = 0;
  }
  const mode = opt.mode;
  sh = { list, i: mode === 'pages' ? Math.floor(i / opt.per) : i, mode, tok: 0, timer: null, paused: false, lock: null, hideT: null };
  $('#stage').innerHTML = '';
  $('#shName').textContent = '';
  $('#show').hidden = false;
  document.body.classList.add('lock');
  $('#shPause').textContent = PAUSE;
  keepAwake();
  showCtl();
  showSlide(1);
}
const showCount = () => sh.mode === 'pages' ? Math.ceil(sh.list.length / opt.per) : sh.list.length;
// Bỏ 1 phần tử khỏi sân khấu (giải phóng URL ảnh lớn)
function dropEl(el) {
  if (el.dataset.url) URL.revokeObjectURL(el.dataset.url);
  el.remove();
}
async function showSlide(dir) {
  const s = sh, tok = ++s.tok;
  clearTimeout(s.timer);
  $('#shCnt').textContent = `${s.i + 1} / ${showCount()}`;
  let el, c = null;
  if (s.mode === 'pages') {
    el = document.createElement('div');
    el.className = 'page';
    el.innerHTML = pocketsHtml(s.list, s.i, opt.per, false);
    await Promise.all([...el.querySelectorAll('img[data-t]')].map(async im => {
      im.src = await thumbUrl(im.dataset.t);
      try { await im.decode(); } catch (e) {}
    }));
  } else {
    c = s.list[s.i];
    el = new Image();
    el.className = 'sl';
    el.alt = '';
    el.src = el.dataset.url = await imgUrl(c.id);
    try { await el.decode(); } catch (e) {}
  }
  if (sh !== s || s.tok !== tok) { dropEl(el); return; }
  animateIn($('#stage'), el, s.mode, dir);
  $('#shName').textContent = opt.showName && c ? c.name : '';
  schedule();
}
function animateIn(st, el, mode, dir) {
  const olds = [...st.children].filter(x => !x.dataset.out);
  const out = (o, ms, css) => { o.dataset.out = 1; Object.assign(o.style, css); setTimeout(() => dropEl(o), ms); };
  const later = css => requestAnimationFrame(() => requestAnimationFrame(() => Object.assign(el.style, css)));
  const C = 'translate(-50%,-50%)';
  if (mode === 'pages') {                      // trang mới nằm dưới, trang cũ lật sang trái như sách
    st.insertBefore(el, st.firstChild);
    olds.forEach(o => out(o, 1050, { transition: 'transform 1s cubic-bezier(.45,.05,.3,1)', transform: 'rotateY(-170deg)' }));
    return;
  }
  st.appendChild(el);
  if (mode === 'fade') {                       // mờ dần + phóng to chậm
    Object.assign(el.style, { opacity: 0, transform: C });
    later({ transition: `opacity 1s, transform ${opt.sec + 1.5}s linear`, opacity: 1, transform: opt.motion ? C + ' scale(1.08)' : C });
    olds.forEach(o => out(o, 1000, { transition: 'opacity 1s', opacity: 0 }));
  } else if (mode === 'slide') {               // trượt ngang
    el.style.transform = `${C} translateX(${dir * 100}vw)`;
    later({ transition: 'transform .9s cubic-bezier(.3,.7,.2,1)', transform: C });
    olds.forEach(o => out(o, 900, { transition: 'transform .9s cubic-bezier(.3,.7,.2,1)', transform: `${C} translateX(${-dir * 100}vw)` }));
  } else if (mode === 'flip') {                // lật mặt thẻ
    el.style.transform = `${C} rotateY(${dir * 180}deg)`;
    later({ transition: 'transform 1s ease-in-out', transform: `${C} rotateY(0deg)` });
    olds.forEach(o => out(o, 1000, { transition: 'transform 1s ease-in-out', transform: `${C} rotateY(${-dir * 180}deg)` }));
  } else if (mode === 'deal') {                // chia bài: bay từ dưới lên, chồng lệch nhau (giữ tối đa 5 lá)
    const r = (Math.random() * 16 - 8).toFixed(1), dx = (Math.random() * 30 - 15).toFixed(0);
    el.style.transform = `${C} translateY(110vh) rotate(25deg)`;
    later({ transition: 'transform .9s cubic-bezier(.3,.7,.2,1)', transform: `${C} translateX(${dx}px) rotate(${r}deg)` });
    if (olds.length > 4) out(olds[0], 600, { transition: 'opacity .6s', opacity: 0 });
  } else if (mode === 'spin') {                // xoay tròn 3D rồi dừng phía trước
    Object.assign(el.style, { opacity: 0, transform: `${C} rotateY(-540deg) scale(.3)` });
    later({ transition: 'transform 1.4s cubic-bezier(.2,.8,.2,1),opacity .6s', opacity: 1, transform: `${C} rotateY(0deg) scale(1)` });
    olds.forEach(o => out(o, 500, { transition: 'opacity .5s,transform .5s', opacity: 0, transform: `${C} scale(1.3)` }));
  }
}
function schedule() {
  clearTimeout(sh.timer);

// ===== Sao lưu / khôi phục (file .zip: data.json + ảnh JPEG, mở được trên máy tính) =====
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// Tạo file zip không nén (ảnh JPEG đã được nén sẵn). data: Uint8Array hoặc Blob
function zipWriter() {
  const parts = [], dir = [];
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let off = 0;
  return {
    async add(name, data) {
      const nm = new TextEncoder().encode(name);
      const u8 = data instanceof Blob ? new Uint8Array(await data.arrayBuffer()) : data;
      const crc = crc32(u8), size = u8.length;
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true);
      h.setUint32(18, size, true); h.setUint32(22, size, true); h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
      parts.push(h, nm, data);                   // Blob: giữ nguyên Blob (không giữ bản sao trong bộ nhớ)
      dir.push({ nm, crc, size, off });
      off += 30 + nm.length + size;
    },
    finish() {
      let len = 0;
      dir.forEach(e => {
        const c = new DataView(new ArrayBuffer(46));
        c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
        c.setUint16(10, 0, true); c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, e.crc, true);
        c.setUint32(20, e.size, true); c.setUint32(24, e.size, true); c.setUint16(28, e.nm.length, true);
        c.setUint32(42, e.off, true);
        parts.push(c, e.nm);
        len += 46 + e.nm.length;
      });
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true); end.setUint16(8, dir.length, true); end.setUint16(10, dir.length, true);
      end.setUint32(12, len, true); end.setUint32(16, off, true);
      parts.push(end);
      return new Blob(parts, { type: 'application/zip' });
    }
  };
}
// Đọc file zip. Trả về {names, get(tên, kiểu) → Blob}. Đọc được cả zip nén lại trên máy tính (nếu trình duyệt hỗ trợ)
async function zipRead(file) {
  const tailLen = Math.min(file.size, 65557);
  const tail = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
  let p = -1;
  for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { p = i; break; }
  if (p < 0) throw new Error('Not a zip file');
  const n = tail.getUint16(p + 10, true), len = tail.getUint32(p + 12, true), start = tail.getUint32(p + 16, true);
  const cd = new DataView(await file.slice(start, start + len).arrayBuffer());
  const dec = new TextDecoder();
  const entries = new Map();
  let q = 0;
  for (let i = 0; i < n; i++) {
    if (cd.getUint32(q, true) !== 0x02014b50) throw new Error('Broken zip file');
    const nl = cd.getUint16(q + 28, true), xl = cd.getUint16(q + 30, true), cl = cd.getUint16(q + 32, true);
    entries.set(dec.decode(new Uint8Array(cd.buffer, q + 46, nl)),
      { method: cd.getUint16(q + 10, true), csize: cd.getUint32(q + 20, true), off: cd.getUint32(q + 42, true) });
    q += 46 + nl + xl + cl;
  }
  return {
    names: [...entries.keys()],
    async get(name, type) {
      const e = entries.get(name);
      if (!e) return null;
      const h = new DataView(await file.slice(e.off, e.off + 30).arrayBuffer());
      const s = e.off + 30 + h.getUint16(26, true) + h.getUint16(28, true);
      const raw = file.slice(s, s + e.csize, type || '');
      if (e.method === 0) return raw;
      if (e.method === 8 && typeof DecompressionStream !== 'undefined') {
        const b = await new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
        return new Blob([b], { type: type || '' });
      }
      throw new Error('Unsupported zip file');
    }
  };
}

async function exportData() {
  if (!cards.length) { toast('No cards to export'); return; }
  const now = new Date();
  const ymd = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  const name = 'Picards-' + ymd + '.zip';
  let blob;
  try {
    const z = zipWriter();
    const data = { app: 'Picards', ver: 2, date: now.toISOString(), albums, cards: allCards() };
    await z.add('data.json', new TextEncoder().encode(JSON.stringify(data, null, 1)));
    for (let i = 0; i < cards.length; i++) {
      toast(`Preparing backup ${i + 1} / ${cards.length}…`, true);
      const id = cards[i].id;
      const im = await getOne('imgs', id), th = await getOne('thumbs', id);
      if (im) await z.add(`cards/${id}.jpg`, im.b);
      if (th) await z.add(`thumbs/${id}.jpg`, th.b);
    }
    blob = z.finish();
  } catch (err) {
    toast('Export failed');
    return;
  }
  toast(`Backup ready (${(blob.size / 1048576).toFixed(1)} MB)`);
  try {
    const file = new File([blob], name, { type: 'application/zip' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return;
    }
  } catch (e) {
    if (e.name === 'AbortError') return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

$('#fileIn').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  let z, base, inAlbums, inCards;
  try {
    z = await zipRead(f);
    const dj = z.names.find(n => n === 'data.json' || n.endsWith('/data.json'));
    base = dj.slice(0, -'data.json'.length);    // zip nén lại trên máy tính có thể có thêm thư mục ở đầu
    const d = JSON.parse(await (await z.get(dj)).text());
    if (d.app !== 'Picards' || !Array.isArray(d.albums) || !Array.isArray(d.cards)) throw new Error();
    inAlbums = d.albums.filter(a => a && a.id).map(a => ({ id: String(a.id), name: String(a.name || 'Album'), order: Number(a.order) || 0 }));
    inCards = d.cards.filter(c => c && c.id).map(c => ({ id: String(c.id), album: String(c.album || ''), name: String(c.name || ''),
      order: Number(c.order) || 0, added: Number(c.added) || Date.now(), size: Number(c.size) || 0 }));
  } catch (err) {
    toast('Invalid file');
    return;
  }
  const r = await ask({
    title: 'Import backup',
    msg: `The file has ${inCards.length} cards. What do you want to do?`,
    buttons: [{ label: 'Cancel', value: null }, { label: 'Replace all', value: 'rep', cls: 'danger' }, { label: 'Merge', value: 'merge', cls: 'primary' }]
  });
  if (!r.btn) return;
  if (r.btn === 'rep') {
    if (!(await confirmDlg('Replace all', 'All current cards will be deleted and replaced by the backup. Continue?', 'Replace'))) return;
    await write(['albums', 'cards', 'imgs', 'thumbs'].map(s => [s, 'clear']));
    [...thumbUrls.keys()].forEach(dropThumb);
    albums = [];
    cards = [];
  }
  // Gộp: thẻ đã có (cùng id) thì giữ nguyên, chỉ thêm thẻ chưa có, xếp vào cuối sổ theo thứ tự trong file
  const ao = new Map(inAlbums.map(a => [a.id, a.order]));
  inCards.sort((a, b) => ((ao.get(a.album) || 0) - (ao.get(b.album) || 0)) || a.order - b.order);
  if (!albums.length) await unifyAlbum();
  const have = new Set(cards.map(c => c.id));
  const todo = inCards.filter(c => !have.has(c.id));
  let order = nextOrder(cards), ok = 0, bad = 0;
  progress(0, todo.length);
  for (let i = 0; i < todo.length; i++) {
    toast(`Importing ${i + 1} / ${todo.length}…`, true);
    const c = todo[i];
    try {
      const b = await z.get(`${base}cards/${c.id}.jpg`, 'image/jpeg');
      if (!b) throw new Error();
      const t = (await z.get(`${base}thumbs/${c.id}.jpg`, 'image/jpeg')) || await toJpeg(await loadImage(b), THUMB_MAX, 0.8);
      c.album = mainId();
      c.order = order++;
      c.size = b.size + t.size;
      await write([['imgs', 'put', { id: c.id, b }], ['thumbs', 'put', { id: c.id, b: t }], ['cards', 'put', c]]);
      cards.push(c);
      ok++;
    } catch (err) {
      if (isFull(err)) { toast('Storage is full'); break; }
      bad++;
    }
    progress(i + 1, todo.length);
  }
  progress(todo.length, todo.length);
  toast(`Imported ${ok} cards` + (bad ? ` (${bad} failed)` : ''));
  pg = 0;
  go('');
};

// ===== Khởi động =====
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./sw.js');
}
(async () => {
  try {
    albums = await getAll('albums');
    cards = await getAll('cards');
    await unifyAlbum();                          // dữ liệu cũ nhiều album → gộp thành 1 sổ
    if (!opt.init) { opt.init = true; saveOpt(); }
  } catch (e) {
    setBar('Picards', null, []);
    app.innerHTML = '<p class="empty">Cannot open storage on this device.</p>';
    return;
  }
  render();
})();
</script>
